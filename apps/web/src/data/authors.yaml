# =============================================================================
# Author Registry
# Central author data used across all content types. Each author is keyed by
# slug, which is the value used in content frontmatter `author:` field.
#
# Fields:
#   name   – display name
#   slug   – frontmatter reference (kebab-case)
#   role   – title / position
#   bio    – short description
#   avatar – profile photo URL
#   stats  – optional achievements (label + value)
# =============================================================================


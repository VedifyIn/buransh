# =============================================================================
# Site Configuration
# Central config for Astro build, integrations, fonts, and PWA.
# All values are read by astro.config.mjs at build time.
# =============================================================================

# Production URL (used as Astro `site` and canonical base)
site: https://buransh.labs.vedify.in

# Append trailing slash to URLs: "always" | "never" | "ignore"
trailingSlash: never

# -----------------------------------------------------------------------------
# Server / Deployment target
#
# Controls which Astro adapter is used (or none for pure static).
#   "cloudflare" — deploys to Cloudflare Workers (requires wrangler.jsonc)
#   "vercel"     — deploys to Vercel Edge / Node
#   "static"     — no adapter, pure static export (default if omitted)
# -----------------------------------------------------------------------------
server: vercel

# -----------------------------------------------------------------------------
# Progressive Web App (PWA) — powered by @vite-pwa/astro
# -----------------------------------------------------------------------------
pwa:
  # Service worker update strategy: "prompt" asks user, "autoUpdate" applies silently
  registerType: autoUpdate

  # Web App Manifest — appears when user installs the PWA
  manifest:
    name: Buransh
    short_name: Buransh
    description: A SEO native Astro Theme
    theme_color: '#C17A2E'
    background_color: '#FAF7F2'
    display: standalone
    icons:
      - src: /icon-192.png
        sizes: 192x192
        type: image/png
      - src: /icon-512.png
        sizes: 512x512
        type: image/png

  # Workbox precaching — controls what assets the service worker caches offline
  workbox:
    globPatterns:
      - '**/*.{css,js,html,svg,png,woff2}'
    navigateFallback: /offline

# -----------------------------------------------------------------------------
# Partytown — offloads third-party scripts (e.g. Google Tag Manager) to a web worker
# -----------------------------------------------------------------------------
partytown:
  forward:
    - dataLayer.push

# -----------------------------------------------------------------------------
# Search — Pagefind configuration
#
# Tags listed here are used as suggestions in the search filter UI.
# They can also be injected via env variables at build time:
#   PUBLIC_SEARCH_TAGS=tag1,tag2,tag3
# Pagefind auto-discovers all tags from content regardless.
# -----------------------------------------------------------------------------
search:
  suggestedTags:
    - Getting Started
    - Guide
    - Reference
    - API
    - Tutorial
    - Deep Dive
    - Case Study
    - Comparison
    - Best Practice
    - Performance

# -----------------------------------------------------------------------------
# Analytics & Consent
#
# Central configuration for analytics services. All are consent-gated:
# scripts only load after the user accepts via the cookie consent banner.
# Set `required: false` to skip the banner entirely.
#
# --- Google Tag Manager ---
#   tagId: GTM-XXXXXX (container ID)
#
# --- Vercel ---
#   analytics: true  → loads Vercel Web Analytics
#   speedInsights: true → loads Vercel Speed Insights (Core Web Vitals RUM)
#
# --- Cloudflare ---
#   token: beacon token from Cloudflare Web Analytics dashboard
# -----------------------------------------------------------------------------
analytics:
  consent:
    required: true
  google:
    enabled: false
    tagId: ''
  vercel:
    enabled: false
    analytics: false
    speedInsights: false
  cloudflare:
    enabled: false
    token: ''

# -----------------------------------------------------------------------------
# Markdown / Shiki syntax highlighting themes
# -----------------------------------------------------------------------------
markdown:
  shikiConfig:
    themes:
      light: github-light
      dark: github-dark

# -----------------------------------------------------------------------------
# Organization — used for JSON-LD structured data (Organization schema)
# -----------------------------------------------------------------------------
organization:
  name: Vedify
  url: https://buransh.labs.vedify.in
  logo: /favicon.svg
  description: A SEO native Astro Theme powering quality content for curious minds.
  sameAs:
    - https://github.com/anomalyco/buransh

# -----------------------------------------------------------------------------
# DaisyUI Theme
#
# `default` is the theme loaded by default (light). `prefersdark` is loaded
# when the user's OS prefers dark color scheme. Theme names must match
# built-in DaisyUI themes or custom themes defined in global.css.
# -----------------------------------------------------------------------------
theme:
  default: vedify
  prefersdark: vedify-dark

# -----------------------------------------------------------------------------
# Fonts
#
# `defaultFont` controls which font is:
#   1. Preloaded via <Font preload /> in BaseHead.astro
#   2. Applied as the body default via the --font-body CSS variable
#
# To switch the site-wide default font, change the value below and rebuild.
# All fonts declared here are available via their CSS variables (e.g. var(--font-creepster)).
# -----------------------------------------------------------------------------
defaultFont: Atkinson

fonts:
  # Atkinson Hyperlegible — clean, highly legible sans-serif (default body font)
  - name: Atkinson
    cssVariable: '--font-atkinson'
    fallbacks:
      - sans-serif
    variants:
      - src:
          - ./src/assets/fonts/atkinson-regular.woff2
        weight: 400
        style: normal
        display: swap
      - src:
          - ./src/assets/fonts/atkinson-bold.woff2
        weight: 700
        style: normal
        display: swap

  # Creepster — Halloween / spooky display font
  - name: Creepster
    cssVariable: '--font-creepster'
    fallbacks:
      - cursive
    variants:
      - src:
          - ./src/assets/fonts/creepster.woff2
        weight: 400
        style: normal
        display: swap

  # Pacifico — cursive / script display font
  - name: Pacifico
    cssVariable: '--font-pacifico'
    fallbacks:
      - cursive
    variants:
      - src:
          - ./src/assets/fonts/pacifico.woff2
        weight: 400
        style: normal
        display: swap

  # Caveat — hand-written / child-like display font
  - name: Caveat
    cssVariable: '--font-caveat'
    fallbacks:
      - cursive
    variants:
      - src:
          - ./src/assets/fonts/caveat-regular.woff2
        weight: 400
        style: normal
        display: swap
      - src:
          - ./src/assets/fonts/caveat-bold.woff2
        weight: 700
        style: normal
        display: swap

  # Fredoka — rounded, playful display font
  - name: Fredoka
    cssVariable: '--font-fredoka'
    fallbacks:
      - sans-serif
    variants:
      - src:
          - ./src/assets/fonts/fredoka-regular.woff2
        weight: 400
        style: normal
        display: swap
      - src:
          - ./src/assets/fonts/fredoka-bold.woff2
        weight: 700
        style: normal
        display: swap

# 🔌 Add your dynamic plug-and-play database setting here
databaseProvider: 'mock' # Or change to "supabase" in your staging/prod environments
